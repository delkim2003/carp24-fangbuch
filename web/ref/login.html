<div class="journal-card w-full max-w-md p-lg md:p-xl mx-auto flex flex-col gap-lg">
<div class="text-center mb-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Willkommen zurück</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Melde dich an, um dein Journal fortzuführen.</p>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-dark-moss uppercase tracking-widest" for="email">E-Mail</label>
<input class="input-inset w-full rounded-lg px-md py-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md" id="email" placeholder="angler@example.com" type="email"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-dark-moss uppercase tracking-widest" for="password">Passwort</label>
<input class="input-inset w-full rounded-lg px-md py-3 text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors font-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-between items-center mt-sm mb-sm">
<a class="font-label-sm text-label-sm text-dark-moss hover:text-primary transition-colors underline decoration-dark-moss/30 hover:decoration-primary/60" href="#">Passwort vergessen?</a>
</div>
<button class="w-full bg-primary-container text-on-primary-container rounded-full py-3 px-lg font-nav-item text-nav-item uppercase tracking-widest hover:bg-surface-tint transition-all scale-95 active:opacity-80 active:scale-95 duration-200 mt-sm" type="submit">
                    ANMELDEN
                </button>
</form>
<div class="mt-md text-center">
<a class="font-body-md text-body-md text-dark-moss hover:text-primary transition-colors" href="#">
                    Noch kein Konto? <span class="underline decoration-dark-moss/30 hover:decoration-primary/60">Registrieren</span>
</a>
</div>
</div>
