<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline": "#8f9287", "primary-fixed-dim": "#bdcca4", "on-tertiary-fixed": "#2c1325", "on-tertiary": "#43283b", "tertiary-container": "#8d6b81", "surface-dim": "#131411", "on-background": "#e4e2dd", "background-light-sand": "#E8E0C8", "on-error": "#690005", "surface-container-lowest": "#0e0e0c", "coyote-brown": "#8B7355", "surface-container-highest": "#353532", "on-secondary-fixed": "#161e08", "on-tertiary-fixed-variant": "#5b3e52", "primary-container": "#6c7a57", "error": "#ffb4ab", "surface-container-high": "#2a2a27", "secondary-container": "#434c32", "surface-container": "#1f201d", "on-primary": "#283417", "tertiary": "#e3bbd4", "tertiary-fixed": "#ffd7ef", "on-primary-fixed": "#141f05", "on-surface-variant": "#c6c8bc", "primary": "#bdcca4", "on-secondary-fixed-variant": "#414a30", "surface-variant": "#353532", "surface-bright": "#393936", "background": "#131411", "error-container": "#93000a", "secondary-fixed-dim": "#c1cba8", "surface": "#131411", "on-tertiary-container": "#fffdff", "on-secondary-container": "#b3bc9b", "inverse-surface": "#e4e2dd", "inverse-on-surface": "#30312d", "tertiary-fixed-dim": "#e3bbd4", "inverse-primary": "#556342", "secondary-fixed": "#dde7c3", "on-primary-fixed-variant": "#3e4b2c", "surface-container-low": "#1b1c19", "surface-tint": "#bdcca4", "primary-fixed": "#d9e8be", "background-dark": "#1A1F16", "on-error-container": "#ffdad6", "text-sand": "#D4C9A8", "on-secondary": "#2b331b", "signal-green": "#8FA98A", "on-primary-container": "#fdfff0", "secondary": "#c1cba8", "tactical-gray": "#5A5A56", "outline-variant": "#45483f", "on-surface": "#e4e2dd" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "margin-mobile": "1.25rem", "touch-target": "44px", "gutter": "1rem", "margin-desktop": "2.5rem" }, "fontFamily": { "headline-md": ["Inter"], "headline-sm": ["Inter"], "label-tactical": ["JetBrains Mono"], "body-md": ["Inter"], "headline-lg": ["Inter"], "data-mono": ["JetBrains Mono"], "body-lg": ["Inter"] }, "fontSize": { "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }], "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "700" }], "label-tactical": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }], "data-mono": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }] } } } };</script></head><body class="bg-background-dark text-on-surface font-body-md min-h-screen flex flex-col justify-center px-margin-mobile"><main class="w-full"><div class="flex flex-col w-full h-full min-h-[100dvh] bg-background-dark text-on-surface p-margin-mobile relative overflow-hidden" id="login-container">
<!-- Ambient background elements -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]">
<svg height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="1"></path>
</pattern>
</defs>
<rect class="text-text-sand" fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<div class="absolute top-0 right-0 p-4 pointer-events-none opacity-20 flex flex-col items-end space-y-1">
<div class="font-label-tactical text-text-sand text-[10px]">SYS.OP: ONLINE</div>
<div class="font-label-tactical text-text-sand text-[10px]">BAT: 84% STABLE</div>
</div>
<!-- Main Content -->
<div class="flex-1 flex flex-col items-center justify-center w-full max-w-sm mx-auto z-10 relative">
<!-- Logo Badge -->
<div class="w-32 h-32 mb-8 relative group cursor-pointer" id="logo-badge">
<img alt="carp24-badge-logo" class="w-full h-full object-contain rounded-full border border-outline-variant p-2 group-hover:scale-105 transition-transform duration-300 ease-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBvImAIPJZ9W_EVZwWme7vbrSSvNlaokmc4xiA2V-FZ2E_QA76WqlbSE0QNGqoDnrblfpKtoR8X4M8_VlVdnc969dm6EFffP9FxQMtgeHMZZ9rgPOI0VPIZRne_eML1ZrZShaVAqofk568CASS4PzBYjx_KaNSpOjEKCL57n5N5UELjaBm0Mdznpr1F82G4kwVAuYb2DoCbAjmNyxBmcnjnhgNDqcKsynoMw0RBcloTAk5KbH0qCCGcaQ"/>
<div class="absolute -inset-2 border border-primary-container/30 rounded-full animate-[spin_10s_linear_infinite] opacity-50"></div>
</div>
<!-- Header Text -->
<div class="text-center mb-10 space-y-2">
<h1 class="font-headline-md text-headline-md tracking-wider text-text-sand uppercase">Access Protocol</h1>
<p class="font-data-mono text-label-tactical text-tactical-gray">AUTH. REQ. FOR LOGBOOK ENTRY</p>
</div>
<!-- Form -->
<form class="w-full space-y-6" onsubmit="event.preventDefault(); handleLogin();">
<!-- Input: ID / Email -->
<div class="space-y-2 relative group">
<label class="block font-label-tactical text-text-sand uppercase opacity-80 group-focus-within:opacity-100 transition-opacity" for="email">
          [ ID / E-MAIL ]
        </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tactical-gray text-[18px]">person</span>
<input autocomplete="off" class="w-full h-[44px] bg-surface-container-lowest/50 border border-outline-variant rounded-DEFAULT text-on-surface font-data-mono text-data-mono pl-10 pr-4 focus:outline-none focus:border-primary-container focus:bg-surface-container-low/80 transition-colors placeholder:text-tactical-gray/50" id="email" placeholder="OPERATIVE_ID" type="text"/>
</div>
</div>
<!-- Input: Password -->
<div class="space-y-2 relative group">
<label class="block font-label-tactical text-text-sand uppercase opacity-80 group-focus-within:opacity-100 transition-opacity flex justify-between" for="password">
<span>[ PASSWORT ]</span>
<span class="text-tactical-gray hover:text-text-sand cursor-pointer transition-colors" onclick="alert('INITIATE RESET PROTOCOL')">LOST?</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-tactical-gray text-[18px]">lock</span>
<input class="w-full h-[44px] bg-surface-container-lowest/50 border border-outline-variant rounded-DEFAULT text-on-surface font-data-mono text-data-mono pl-10 pr-4 focus:outline-none focus:border-primary-container focus:bg-surface-container-low/80 transition-colors placeholder:text-tactical-gray/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-tactical-gray hover:text-text-sand transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[18px]" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[48px] bg-primary-container text-on-primary-container font-headline-sm text-[16px] uppercase tracking-widest rounded-DEFAULT border border-primary-container hover:bg-inverse-primary hover:border-inverse-primary active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 relative overflow-hidden group" id="login-btn" type="submit">
<span class="relative z-10">ANMELDEN</span>
<span class="material-symbols-outlined relative z-10 text-[20px] group-hover:translate-x-1 transition-transform">login</span>
<div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
</button>
</form>
<!-- Register Link -->
<div class="mt-8 text-center">
<button class="font-label-tactical text-text-sand border-b border-text-sand/30 hover:border-text-sand pb-1 transition-colors uppercase tracking-widest" onclick="alert('SWITCH TO REGISTRATION')">
        NEUEN OPERATIVE REGISTRIEREN
      </button>
</div>
</div>
<!-- Footer Slogan -->
<div class="mt-auto pt-8 pb-4 text-center z-10">
<div class="inline-flex items-center gap-3 font-data-mono text-[10px] text-tactical-gray tracking-[0.2em] uppercase">
<span>PASSION</span>
<span class="w-1 h-1 rounded-full bg-primary-container"></span>
<span>FISHING</span>
<span class="w-1 h-1 rounded-full bg-primary-container"></span>
<span>COMMUNITY</span>
</div>
</div>
</div>
<script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('visibility-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('login-btn');
    const originalText = btn.innerHTML;
    
    // Simulating login process
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> <span class="tracking-widest">VERIFYING...</span>`;
    btn.disabled = true;
    btn.classList.add('opacity-80');

    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-signal-green">check_circle</span> <span class="text-signal-green tracking-widest">ACCESS GRANTED</span>`;
      btn.classList.replace('bg-primary-container', 'bg-surface-container');
      btn.classList.replace('border-primary-container', 'border-signal-green');
      
      // Reset after fake login
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.remove('opacity-80');
        btn.classList.replace('bg-surface-container', 'bg-primary-container');
        btn.classList.replace('border-signal-green', 'border-primary-container');
      }, 1500);
    }, 1200);
  }

  // Interaction feedback on inputs
  const inputs = document.querySelectorAll('input');
  inputs.forEach(input => {
    input.addEventListener('focus', () => {
      input.parentElement.classList.add('scale-[1.01]');
    });
    input.addEventListener('blur', () => {
      input.parentElement.classList.remove('scale-[1.01]');
    });
  });
</script></main></body></html>
