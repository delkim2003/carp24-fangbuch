<body class="min-h-screen flex flex-col font-body-md text-body-md antialiased">
<!-- Top Navigation -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-surface dark:bg-surface-dim border-b border-outline-variant/40">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-headline-md text-headline-md">
                C
            </div>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">Carp24</span>
</div>
<!-- Desktop Nav -->
<nav class="hidden md:flex gap-8">
<a class="font-nav-item text-nav-item uppercase tracking-widest text-primary border-b-2 border-primary pb-1" href="#">FANGBUCH</a>
<a class="font-nav-item text-nav-item uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">STATISTIK</a>
<a class="font-nav-item text-nav-item uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">PREIS</a>
</nav>
<div class="flex items-center gap-4">
<button class="text-primary hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-5xl mx-auto px-margin-mobile md:px-margin-desktop py-xl">
<div class="mb-xl text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Neuen Fang eintragen</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">Dokumentiere die Details deines Fangs für das Journal.</p>
</div>
<form class="bg-[#CCCA9B] rounded-xl border hairline-border p-lg md:p-xl shadow-sm">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-xl">
<!-- Left Column -->
<div class="flex flex-col gap-lg">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="datum">DATUM</label>
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="datum" name="datum" type="date"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="gewaesser">GEWÄSSER</label>
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="gewaesser" name="gewaesser" placeholder="Name des Sees oder Flusses" type="text"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="fischart">FISCHART</label>
<select class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12 appearance-none" id="fischart" name="fischart">
<option value="">Auswählen...</option>
<option value="karpfen">Karpfen</option>
<option value="hecht">Hecht</option>
<option value="zander">Zander</option>
<option value="barsch">Barsch</option>
</select>
</div>
</div>
<!-- Right Column -->
<div class="flex flex-col gap-lg">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="gewicht">GEWICHT (KG)</label>
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="gewicht" name="gewicht" placeholder="0.0" step="0.1" type="number"/>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="laenge">LÄNGE (CM)</label>
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="laenge" name="laenge" placeholder="0" type="number"/>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="lufttemperatur">LUFTTEMPERATUR</label>
<div class="relative">
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="lufttemperatur" name="lufttemperatur" placeholder="°C" type="number"/>
<span class="absolute right-3 top-3 text-secondary material-symbols-outlined text-[20px]" data-icon="thermostat">thermostat</span>
</div>
</div>
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="wassertemperatur">WASSERTEMPERATUR</label>
<div class="relative">
<input class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 h-12" id="wassertemperatur" name="wassertemperatur" placeholder="°C" type="number"/>
<span class="absolute right-3 top-3 text-secondary material-symbols-outlined text-[20px]" data-icon="water_drop">water_drop</span>
</div>
</div>
</div>
</div>
</div>
<hr class="border-t hairline-border my-xl"/>
<div class="flex flex-col gap-lg">
<!-- Photo Upload -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary">FOTO HOCHLADEN</label>
<div class="w-full h-48 bg-[#E8E0C8] border-2 border-dashed hairline-border rounded-lg flex flex-col items-center justify-center cursor-pointer hover:bg-[#dfe4d6] transition-colors">
<span class="material-symbols-outlined text-4xl text-primary mb-2" data-icon="add_a_photo">add_a_photo</span>
<span class="font-nav-item text-nav-item text-secondary">Bild auswählen oder ablegen</span>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-sm">
<label class="font-label-sm text-label-sm uppercase text-secondary" for="notizen">NOTIZEN</label>
<textarea class="w-full input-inset border-0 rounded border-b hairline-border focus:ring-0 focus:border-primary font-body-md text-body-md py-3 px-4 resize-none" id="notizen" name="notizen" placeholder="Besondere Vorkommnisse, Köder, Wetterdetails..." rows="4"></textarea>
</div>
<!-- Catch & Release -->
<div class="flex items-center gap-3 pt-md">
<input class="w-5 h-5 rounded border hairline-border text-primary focus:ring-primary input-inset" id="catch_release" name="catch_release" type="checkbox"/>
<label class="font-label-sm text-label-sm uppercase text-secondary pt-1 cursor-pointer" for="catch_release">CATCH &amp; RELEASE</label>
</div>
<div class="pt-xl flex justify-end">
<button class="bg-primary-container text-on-primary-container font-nav-item text-nav-item uppercase py-4 px-8 rounded-full hover:bg-surface-tint transition-colors shadow-sm w-full md:w-auto" type="submit">
                        FANG SPEICHERN
                    </button>
</div>
</div>
</form>
</main>
<!-- Footer -->
<footer class="w-full py-xl bg-surface dark:bg-surface-dim border-t border-outline-variant/20 flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop gap-md mt-auto">
<div class="font-nav-item text-nav-item text-on-surface">
            © 2024 Carp24
        </div>
<div class="flex gap-md">
<a class="font-label-sm text-label-sm uppercase text-secondary dark:text-secondary-fixed hover:text-primary underline transition-all opacity-80" href="#">Impressum</a>
<a class="font-label-sm text-label-sm uppercase text-secondary dark:text-secondary-fixed hover:text-primary underline transition-all opacity-80" href="#">Datenschutz</a>
</div>
</footer>
<!-- Mobile Bottom Nav (Visible only on small screens) -->
<div class="md:hidden fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant/40 flex justify-around items-center py-3 px-4 z-50">
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" data-icon="book" style="font-variation-settings: 'FILL' 1;">book</span>
<span class="font-label-sm text-[10px] uppercase">Fangbuch</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary" href="#">
<span class="material-symbols-outlined" data-icon="analytics" style="font-variation-settings: 'FILL' 0;">analytics</span>
<span class="font-label-sm text-[10px] uppercase">Statistik</span>
</a>
<a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary" href="#">
<span class="material-symbols-outlined" data-icon="payments" style="font-variation-settings: 'FILL' 0;">payments</span>
<span class="font-label-sm text-[10px] uppercase">Preis</span>
</a>
</div>
</body></html>
